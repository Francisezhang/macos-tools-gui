[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "macos-tools-gui"
version = "1.0.0"
description = "Cross-platform GUI for macOS Tools Bundle — unified launcher with 5 tools"
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-qt>=4.2.0"]
build = ["pyinstaller>=6.0.0"]

[project.scripts]
macos-tools = "gui.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"